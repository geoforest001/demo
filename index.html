<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="デモ用マップアプリ" />
    <title>デモ用マップアプリ</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css?v=1" />
    <!-- ★ 各事業体の設定ファイル（必ずmain.jsより前に読み込む） -->
    <script src="./config.js?v=1"></script>
  </head>
  <body>
    <main class="page">
      <section class="map-card">
        <div id="map" aria-label="地図"></div>
      </section>
    </main>

    <!-- 読み込みインジケーター -->
    <div id="loadingIndicator">
      <div id="loadingInner">
        <div id="loadingSpinner"></div>
        <div id="loadingText">データ読み込み中...</div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <!-- ライトボックス（ジオタグ写真拡大表示） -->
    <div id="lightbox"><img id="lightboxImg" src="" alt=""></div>

    <!-- カメラ入力（常時DOM保持・iOS対策） -->
    <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" />

    <!-- Excel連携: ファイル入力（非表示） -->
    <input id="xlsxInput" type="file" accept=".xlsx,.xls,.csv" style="display:none" />

    <!-- Excel連携モーダル -->
    <div id="xlsxModal">
      <div id="xlsxModalBox">
        <div id="xlsxModalTitle">📊 Excel / CSV 連携</div>
        <div id="xlsxModalInfo"></div>
        <div class="xlsxRow">
          <label class="xlsxLabel">対象レイヤ</label>
          <select id="xlsxLayerSel"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">レイヤ側キー列</label>
          <select id="xlsxKeyGeo"></select>
        </div>
        <div class="xlsxRow">
          <label class="xlsxLabel">Excel側キー列</label>
          <select id="xlsxKeyXls"></select>
        </div>
        <div class="xlsxRow" id="xlsxColorRow">
          <label class="xlsxLabel">色分け列（PMTiles のみ）</label>
          <select id="xlsxColorCol"><option value="">── 色分けなし ──</option></select>
        </div>
        <div class="xlsxBtns">
          <button id="xlsxModalCancel">キャンセル</button>
          <button id="xlsxModalOk" class="xlsxOk">連携する</button>
        </div>
      </div>
    </div>

    <!-- Excel連携: 統計カード -->
    <div id="xlsxStatCard">
      <span id="xlsxStatText"></span>
      <button id="xlsxStatClose">解除</button>
    </div>

    <!-- Excel連携: 色分け凡例 -->
    <div id="xlsxLegend" style="display:none"></div>

    <!-- 印刷: A4範囲選択フレーム -->
    <div id="printFrame">
      <div id="printFrameBox">
        <div id="printFrameLabel">印刷範囲（A4）</div>
        <div id="printFrameNorth">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="44" height="51">
            <text x="50" y="13" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d3c5e" font-family="Arial,sans-serif">N</text>
            <circle cx="50" cy="67" r="42" fill="none" stroke="#2d3c5e" stroke-width="3.5"></circle>
            <polygon points="50,26 27,70 50,62 73,70" fill="#2d3c5e"></polygon>
            <polygon points="50,108 27,70 50,62 73,70" fill="white" stroke="#2d3c5e" stroke-width="2.5" stroke-linejoin="round"></polygon>
          </svg>
        </div>
      </div>
      <div id="printFrameBar">
        <button id="printFrameCancel">キャンセル</button>
        <button id="printFrameOrient">横向き</button>
        <button id="printFrameNext">次へ →</button>
      </div>
    </div>

    <!-- 印刷: タイトル入力モーダル -->
    <div id="printModal">
      <div id="printModalBox">
        <div id="printModalTitle">🖨️ 印刷</div>
        <input id="printMapTitle" type="text" placeholder="タイトルを入力（任意）" maxlength="40">
        <div id="printScaleRow">
          <span id="printScaleLabel">縮尺</span>
          <span id="printScaleSep">1 /</span>
          <input id="printScaleInput" type="number" min="1" max="9999999" placeholder="（省略可）">
        </div>
        <div class="xlsxBtns">
          <button id="printCancel">キャンセル</button>
          <button id="printOk" class="xlsxOk">印刷する</button>
        </div>
      </div>
    </div>

    <!-- 印刷時ヘッダー（@media print で表示） -->
    <div id="printHeader">
      <div id="printHeaderTop">
        <div id="printHeaderMapTitle">デモ用マップアプリ</div>
        <div id="printHeaderMeta"></div>
      </div>
      <div id="printHeaderScale"></div>
    </div>

    <!-- 連絡掲示板 フロートボタン -->
    <button id="bbsFloatBtn">📋 連絡掲示板<span id="bbsBadge"></span></button>

    <!-- 連絡掲示板 パネル -->
    <div id="bbsPanel">
      <div id="bbsHandle">
        <div id="bbsHandleGrip"><span></span><span></span><span></span></div>
        <span id="bbsPanelTitle">📋 連絡掲示板</span>
        <button id="bbsLogBtn" title="投稿ログ">📄</button>
        <button id="bbsRefreshBtn" title="更新">🔄</button>
        <button id="bbsCollapseBtn" title="折りたたむ">▾</button>
        <button id="bbsClose">✕</button>
      </div>
      <div id="bbsBody">
        <!-- 投稿者バー -->
        <div id="bbsAuthorBar">
          <span id="bbsAuthorBarLabel">👤</span>
          <span id="bbsAuthorBarInfo">未登録</span>
          <button id="bbsAuthorEditBtn">変更</button>
        </div>
        <div id="bbsAuthorEditor" style="display:none">
          <input id="bbsAuthorInput" type="text" placeholder="表示名を入力..." maxlength="20">
          <button id="bbsAuthorSaveBtn">保存</button>
        </div>
        <!-- 投稿一覧 -->
        <div id="bbsListPane" class="bbs-pane">
          <button id="bbsNewBtn">＋ 新規投稿</button>
          <div id="bbsLoadingMsg">読み込み中...</div>
          <div id="bbsEmptyMsg" style="display:none">投稿がありません</div>
          <div id="bbsList"></div>
        </div>
        <!-- 新規投稿フォーム -->
        <div id="bbsNewPane" class="bbs-pane" style="display:none">
          <!-- ① タイプ選択 -->
          <div id="bbsTypePane">
            <button class="bbs-back-to-list-btn">← 一覧に戻る</button>
            <button class="bbs-type-big-btn" data-type="notice">
              <span class="bbs-tbig-icon">📢</span>
              <span class="bbs-tbig-text">連絡事項<small>（お知らせ・周知）</small></span>
            </button>
            <button class="bbs-type-big-btn" data-type="finding">
              <span class="bbs-tbig-icon">🔍</span>
              <span class="bbs-tbig-text">現場発見<small>（写真・位置情報付き）</small></span>
            </button>
            <button class="bbs-type-big-btn" data-type="consult">
              <span class="bbs-tbig-icon">💬</span>
              <span class="bbs-tbig-text">相談<small>（質問・意見）</small></span>
            </button>
          </div>
          <!-- ② テキストフォーム（連絡事項・相談） -->
          <div id="bbsTextPane" style="display:none">
            <button class="bbs-back-btn">← 戻る</button>
            <div class="bbs-field">
              <label>コメント <span style="color:#c00">*</span></label>
              <textarea id="bbsTextComment" rows="4" placeholder="内容を入力..."></textarea>
            </div>
          </div>
          <!-- ③ 現場発見フォーム -->
          <div id="bbsFindingPane" style="display:none">
            <button class="bbs-back-btn">← 戻る</button>
            <div class="bbs-field">
              <label>コメント <span style="color:#c00">*</span></label>
              <textarea id="bbsFindingComment" rows="3" placeholder="発見内容を入力..."></textarea>
            </div>
            <div class="bbs-field">
              <label>写真（任意）</label>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <button class="bbs-action-btn" id="bbsTakePhotoBtn">📷 撮影する</button>
                <button class="bbs-action-btn" id="bbsPickPhotoBtn">🖼 ギャラリー</button>
              </div>
              <img id="bbsPhotoPreview" style="display:none;max-width:120px;max-height:80px;border-radius:6px;margin-top:6px;cursor:pointer" alt="">
            </div>
            <div class="bbs-field">
              <label>位置情報</label>
              <span id="bbsLocStatus" style="font-size:12px;color:#555">取得中...</span>
              <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">
                <button class="bbs-action-btn" id="bbsClearLocBtn">✕ 位置情報を消す</button>
                <button class="bbs-action-btn" id="bbsUsePhotoLocBtn" style="display:none">📷 写真の位置を使う</button>
              </div>
            </div>
          </div>
          <button id="bbsSubmitBtn" style="display:none">📤 投稿する</button>
          <div id="bbsFormStatus"></div>
        </div>
      </div>
    </div>

    <!-- 連絡掲示板 ログモーダル -->
    <div id="bbsLogModal">
      <div id="bbsLogBox">
        <div id="bbsLogModalTitle">
          <span>📄 投稿ログ</span>
          <button id="bbsLogModalClose">✕</button>
        </div>
        <div id="bbsLogFilterRow">
          <input type="date" id="bbsLogFrom">
          <span>〜</span>
          <input type="date" id="bbsLogTo">
          <button id="bbsLogSearchBtn">表示</button>
        </div>
        <div id="bbsLogCount"></div>
        <div id="bbsLogList"></div>
        <div id="bbsLogFooter">
          <button id="bbsLogCloseBtn">閉じる</button>
          <button id="bbsLogCsvBtn">📥 CSV</button>
          <button id="bbsLogPrintBtn">🖨️ 印刷</button>
        </div>
      </div>
    </div>

    <!-- 印刷時 方位記号・縮尺（@media print で表示） -->
    <div id="printNorthOnMap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="58" height="67">
        <text x="50" y="13" text-anchor="middle" font-size="17" font-weight="bold" fill="#2d3c5e" font-family="Arial,sans-serif">N</text>
        <circle cx="50" cy="67" r="42" fill="none" stroke="#2d3c5e" stroke-width="3.5"></circle>
        <polygon points="50,26 27,70 50,62 73,70" fill="#2d3c5e"></polygon>
        <polygon points="50,108 27,70 50,62 73,70" fill="white" stroke="#2d3c5e" stroke-width="2.5" stroke-linejoin="round"></polygon>
      </svg>
    </div>
    <div id="printMapScale"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/protomaps-leaflet@4.0.1/dist/protomaps-leaflet.js" crossorigin=""></script>
    <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/georaster/dist/georaster.browser.bundle.min.js"></script>
    <script src="https://unpkg.com/georaster-layer-for-leaflet/dist/georaster-layer-for-leaflet.min.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
    <script src="./tasks.js?v=1"></script>
    <script src="./main.js?v=1"></script>
    <script src="./weather.js?v=1"></script>
    <script src="./excel.js?v=1"></script>
    <script src="./colorize.js?v=1"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('[SW] registered:', reg.scope))
            .catch(err => console.warn('[SW] registration failed:', err));
        });
      }
    </script>

    <!-- 掲示板: Firebase + bbs.js の遅延ロード -->
    <script>
      (function() {
        var _loaded = false, _loading = false, _queue = [];
        function _onReady() {
          _loaded = true;
          window._bbsStart();
          _queue.forEach(function(fn) { fn(); });
          _queue = [];
        }
        window._loadBbs = function(cb) {
          if (_loaded) { if (cb) cb(); return; }
          if (cb) _queue.push(cb);
          if (_loading) return;
          _loading = true;
          var srcs = [
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
            'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js',
            'https://unpkg.com/exifr/dist/mini.legacy.umd.js',
            './bbs.js?v=1'
          ];
          (function seq(i) {
            if (i >= srcs.length) { _onReady(); return; }
            var s = document.createElement('script');
            s.src = srcs[i];
            s.onerror = function() { console.warn('[BBS] 読込失敗:', srcs[i]); seq(i + 1); };
            s.onload  = function() { seq(i + 1); };
            document.body.appendChild(s);
          })(0);
        };

        /* 掲示板ボタン（初回クリックでロード） */
        document.getElementById('bbsFloatBtn').addEventListener('click', function() {
          _loadBbs(function() { openBbsPanel(); });
        }, { once: true });
      })();
    </script>
  </body>
</html>
